# Kai Agent Configuration
# Copy this file to ~/.k41-agent/config.yaml and customize

# Server configuration
host: "0.0.0.0"
port: 4141

# Feature flags
enable_web: true
enable_api: true
enable_dashboard: true

# System tray (optional) — integrated with `k41` by default
# tray:
#   enabled: true      # Show system tray icon when `k41` starts (default true)
#   autostart: false   # Auto-launch tray on system login (default false)

# Database configuration (optional)
# By default, SQLite is used at ~/.k41-agent/data/agent_state.db
# Only configure this if you want to use PostgreSQL
# database:
#   url: "postgresql+asyncpg://user:password@localhost:5432/k41_agent"

# Runtime/admin configuration is stored in the database and managed from the dashboard:
# - LLM providers, default model, provider API keys, models, and enabled state
# - MCP servers, including encrypted env.* and headers.*
# - Telegram/Discord/Zalo channel settings, including encrypted tokens and secrets
# - GitHub user preferences (channels.github.enabled, default_agent, trigger_label,
#   mention_triggers) plus per-repository bindings in Settings > Connections > GitHub.
#   GitHub App identity is platform-managed via server environment, never dashboard:
#   GITHUB_APP_ID, GITHUB_APP_SLUG, GITHUB_APP_PRIVATE_KEY(_PATH), GITHUB_WEBHOOK_SECRET.
# - google_calendar.enabled (single shared account) managed at Settings > Connections.
#   Google OAuth App is platform-managed via server environment, never dashboard:
#   GOOGLE_CALENDAR_CLIENT_ID, GOOGLE_CALENDAR_CLIENT_SECRET, GOOGLE_CALENDAR_REDIRECT_URI.
# - tools.* (global tool config, e.g. web_search / generate_image credentials)
# - display.timezone (IANA timezone used to render dashboard timestamps)
# - recursion_limit

# Platform-managed fallback in operator YAML (self-host only, optional).
# Environment variables always win over these values. Prefer .env / secret
# manager; use this block only when env is impractical (e.g. single-file deploy).
# If you upgraded from a version that stored these keys in runtime_settings,
# copy the old DB values here (or to .env) once, then delete the orphan rows.
# channels:
#   github:
#     app_id: "123456"
#     app_slug: "k41-agent"
#     # private_key: "-----BEGIN RSA PRIVATE KEY-----\n..."
#     # private_key_path: "/run/secrets/github-app.pem"
#     # webhook_secret: "..."
# google_calendar:
#   client_id: ""
#   client_secret: ""
#   redirect_uri: "http://localhost:4141/integrations/google/callback"

# Tool credentials and per-tool defaults (database-owned).
# Coding tools are shared across all workspace backends. Agent tool_permissions replace
# tools.permissions; the last matching rule wins. Relative paths and symlinks
# cannot escape a workspace. Explicit external paths default to ask.
# tools:
#   shell: null  # Auto-detect PowerShell on Windows, Bash/sh on Linux.
#   storage_root: null  # Defaults outside repositories under ~/.k41-agent.
#   permissions:
#     - { action: edit, resource: "*/secrets/*", effect: deny }
#     - { action: shell, resource: "*", effect: ask }
# Existing tools.* keys in this file are copied into the database once when the
# runtime database source attaches; manage them in the dashboard at
# Settings > Tools. Sending a null value from the dashboard deletes the stored
# override so the schema default applies again.

# Internal security configuration
security:
  # Internal JWT signing secret. Leave empty; the app auto-generates and saves it on first run.
  # This value is not exposed in the dashboard.
  jwt_secret: ""

  # CORS allowed origins (list of URLs or comma-separated string)
  # Default: ["http://localhost:4141", "http://127.0.0.1:4141"]
  # For production, specify your actual frontend domains
  # Example: ["https://app.example.com", "https://www.example.com"]
  cors_origins:
    - "http://localhost:4141"
    - "http://127.0.0.1:4141"

  # CSRF (Cross-Site Request Forgery) protection for cookie-based authentication
  # Default: true (enabled)
  # Note: Requests using Bearer token authentication automatically bypass CSRF checks
  csrf_protection_enabled: true

# Channel integrations are configured in the dashboard at Settings > Channels.
# Existing channel values in config.yaml are copied into the database once when
# the runtime database source is attached, but new edits should be made there.

# Security (optional)
# persistence:
#   allow_any_path: false  # Set to true to allow database outside ~/.k41-agent/

# System prompt cache (optional)
# The assembled system prompt is cached per agent/workspace/toolset so repeated
# LLM turns skip the prompt-variable query and the repo-local skills scan.
# Edits made through the dashboard, the CLI, or the write/edit tools
# invalidate it immediately. The TTL only bounds changes this process cannot
# observe, chiefly writes from another worker, so keep it short.
# Set to 0 to disable caching entirely.
# prompt_cache:
#   ttl_seconds: 20

# Workspace settings (optional)
# workspace:
#   root: "~/.k41-agent/workspaces"
#   github:
#     root: "~/.k41-agent/github-workspaces"
# Local workspace root and backend credentials are configured in the dashboard at Settings > Backends.

# Dashboard display settings (e.g. IANA timezone) are runtime configuration
# stored in the database and managed from the dashboard at Settings > General.

