<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Kai Console · Browser settings concepts</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; background: light-dark(#f5f5f5, #0a0a0a); }
    #browser-settings-concepts { width: min(100% - 32px, 1180px); margin: 24px auto; }
    .concept-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 24px; margin-bottom: 14px; }
    .concept-toolbar p { color: var(--kai-muted); font-size: 12px; }
    .concept-picker { display: flex; flex-wrap: wrap; gap: 5px; }
    #browser-settings-concepts .concept-picker [aria-pressed="true"] { border-color: var(--kai-accent); background: var(--kai-accent); color: var(--kai-accent-fg); }
    @container (max-width: 740px) {
      body #browser-settings-concepts .kai-surface { min-height: 0; }
    }
    @media (max-width: 500px) {
      #browser-settings-concepts { width: calc(100% - 16px); margin: 12px auto; }
    }
  </style>
</head>
<body>
<!-- Preview fragment start -->
<style>
  #browser-settings-concepts {
    --kai-bg: light-dark(#fafafa, #0a0a0a);
    --kai-surface: light-dark(#fff, #111);
    --kai-surface-2: light-dark(#f5f5f5, #171717);
    --kai-surface-3: light-dark(#ededed, #262626);
    --kai-fg: light-dark(#0a0a0a, #fafafa);
    --kai-muted: light-dark(#595959, #a3a3a3);
    --kai-border: light-dark(#e5e5e5, rgb(255 255 255 / .1));
    --kai-border-strong: light-dark(#d4d4d4, rgb(255 255 255 / .16));
    --kai-accent: light-dark(#0a0a0a, #fff);
    --kai-accent-fg: light-dark(#fff, #0a0a0a);
    --kai-accent-hover: light-dark(#262626, #e5e5e5);
    --kai-warning: light-dark(#b45309, #f59e0b);
    --kai-shadow: 0 1px 2px rgb(0 0 0 / .04);
    color: var(--kai-fg);
    font: 400 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: start;
    container-type: inline-size;
  }
  #browser-settings-concepts *, #browser-settings-concepts *::before, #browser-settings-concepts *::after { box-sizing: border-box; }
  #browser-settings-concepts [hidden] { display: none !important; }
  #browser-settings-concepts :is(h1, h2, h3, p) { margin: 0; font-family: inherit; }
  #browser-settings-concepts h1 { font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -.025em; }
  #browser-settings-concepts :is(h2, h3) { font-size: 14px; line-height: 1.4; font-weight: 700; letter-spacing: -.01em; }
  #browser-settings-concepts :is(button, input, select) { font: inherit; color: inherit; }
  #browser-settings-concepts :is(button, input, select, summary):focus-visible { outline: 2px solid var(--kai-accent); outline-offset: 2px; }
  #browser-settings-concepts :is(button, summary, select, input[type="range"]) { cursor: pointer; }
  #browser-settings-concepts button:disabled { cursor: not-allowed; opacity: .55; }
  #browser-settings-concepts svg { display: block; width: 15px; height: 15px; flex: none; }
  #browser-settings-concepts .kai-surface {
    display: grid;
    grid-template-columns: 56px minmax(0, 1fr);
    min-height: 680px;
    border: 1px solid var(--kai-border);
    border-radius: 10px;
    background: var(--kai-bg);
    overflow: clip;
  }
  #browser-settings-concepts .kai-rail { padding: 6px 6px 12px; border-inline-end: 1px solid var(--kai-border); background: var(--kai-surface); }
  #browser-settings-concepts .kai-rail-group { display: grid; justify-items: center; gap: 2px; padding-block: 5px; }
  #browser-settings-concepts .kai-rail-group + .kai-rail-group { border-top: 1px solid var(--kai-border); }
  #browser-settings-concepts .kai-rail-item, #browser-settings-concepts .kai-mark {
    display: grid;
    place-items: center;
    width: 36px;
    height: 30px;
    border-radius: 8px;
    color: var(--kai-muted);
  }
  #browser-settings-concepts .kai-mark { height: 36px; background: var(--kai-accent); color: var(--kai-accent-fg); }
  #browser-settings-concepts .kai-rail-item[aria-current="page"] { background: var(--kai-surface-3); color: var(--kai-fg); }
  #browser-settings-concepts .kai-topbar {
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 0 22px;
    gap: 8px;
    border-bottom: 1px solid var(--kai-border);
    background: var(--kai-surface);
    color: var(--kai-muted);
    font-size: 13px;
  }
  #browser-settings-concepts .kai-topbar svg { width: 12px; height: 12px; }
  #browser-settings-concepts .kai-topbar strong { color: var(--kai-fg); font-weight: 650; }
  #browser-settings-concepts .kai-content { display: grid; gap: 16px; padding: 18px 22px 24px; }
  #browser-settings-concepts .kai-heading { display: grid; gap: 5px; }
  #browser-settings-concepts .kai-hint { color: var(--kai-muted); font-size: 12px; overflow-wrap: anywhere; }
  #browser-settings-concepts .kai-stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
  #browser-settings-concepts .kai-desk { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  #browser-settings-concepts .kai-span { grid-column: 1 / -1; }
  #browser-settings-concepts .kai-box { min-width: 0; border: 1px solid var(--kai-border); border-radius: 10px; background: var(--kai-surface); box-shadow: var(--kai-shadow); }
  #browser-settings-concepts .kai-box-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 12px;
    min-height: 46px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--kai-border);
    border-radius: 9px 9px 0 0;
    background: color-mix(in srgb, var(--kai-surface-2) 45%, var(--kai-surface));
  }
  #browser-settings-concepts .kai-box-top :is(h2, h3), #browser-settings-concepts .kai-action-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  #browser-settings-concepts .kai-body { display: grid; gap: 12px; padding: 13px 14px; }
  #browser-settings-concepts .kai-button {
    min-height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 5px 9px;
    border: 1px solid var(--kai-border);
    border-radius: 8px;
    background: var(--kai-surface);
    color: var(--kai-fg);
    font-size: 12px;
    font-weight: 600;
    text-align: center;
  }
  #browser-settings-concepts .kai-button:not(:disabled):hover { background: var(--kai-surface-2); }
  #browser-settings-concepts .kai-button-main { border-color: var(--kai-accent); background: var(--kai-accent); color: var(--kai-accent-fg); }
  #browser-settings-concepts .kai-button-main:not(:disabled):hover { background: var(--kai-accent-hover); }
  #browser-settings-concepts .kai-button-quiet { border-color: transparent; background: transparent; color: var(--kai-muted); }
  #browser-settings-concepts .kai-field { display: grid; align-content: start; gap: 4px; min-width: 0; font-size: 13px; font-weight: 600; }
  #browser-settings-concepts .kai-input {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 34px;
    padding: 6px 9px;
    border: 1px solid var(--kai-border);
    border-radius: 8px;
    background: var(--kai-surface);
    font-size: 13px;
    font-weight: 400;
  }
  #browser-settings-concepts .kai-input::placeholder { color: var(--kai-muted); }
  #browser-settings-concepts .kai-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
  #browser-settings-concepts .kai-create { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
  #browser-settings-concepts .kai-create .kai-button { min-height: 34px; }
  #browser-settings-concepts .kai-profile-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; border-top: 1px solid var(--kai-border); padding-block: 9px; }
  #browser-settings-concepts .kai-profile-row:last-child { padding-bottom: 0; }
  #browser-settings-concepts .kai-profile-name { min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
  #browser-settings-concepts .kai-badge {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    gap: 5px;
    padding: 2px 7px;
    border: 1px solid var(--kai-border);
    border-radius: 999px;
    background: var(--kai-surface-2);
    color: var(--kai-muted);
    font-size: 11px;
    font-weight: 650;
  }
  #browser-settings-concepts .kai-badge[data-status]::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  #browser-settings-concepts .kai-status { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
  #browser-settings-concepts code, #browser-settings-concepts pre {
    color: inherit;
    background: transparent;
    border: 0;
    padding: 0;
    font: 400 12px/1.5 ui-monospace, "SF Mono", Consolas, monospace;
    overflow-wrap: anywhere;
  }
  #browser-settings-concepts .kai-operation summary { font-size: 12px; color: var(--kai-muted); }
  #browser-settings-concepts .kai-operation pre { margin: 6px 0 0; padding: 8px; border-radius: 8px; background: var(--kai-surface-2); white-space: pre-wrap; }
  #browser-settings-concepts .kai-runtime-actions { display: grid; gap: 10px; }
  #browser-settings-concepts .kai-range { display: grid; gap: 5px; min-width: 0; }
  #browser-settings-concepts .kai-range + .kai-range { padding-top: 10px; border-top: 1px solid var(--kai-border); }
  #browser-settings-concepts .kai-range label { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 3px 8px; font-size: 13px; font-weight: 600; }
  #browser-settings-concepts .kai-range output { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  #browser-settings-concepts .kai-range input { display: block; width: 100%; min-width: 0; margin: 1px 0; accent-color: var(--kai-accent); }
  #browser-settings-concepts .kai-config-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(112px, 32%); align-items: center; gap: 4px 14px; padding-block: 9px; }
  #browser-settings-concepts .kai-config-row + .kai-config-row { border-top: 1px solid var(--kai-border); }
  #browser-settings-concepts .kai-config-row:first-child { padding-top: 0; }
  #browser-settings-concepts .kai-config-row:last-child { padding-bottom: 0; }
  #browser-settings-concepts .kai-restart { color: var(--kai-warning); }
  #browser-settings-concepts .kai-tabs { display: flex; flex-wrap: wrap; gap: 3px 4px; border-bottom: 1px solid var(--kai-border); }
  #browser-settings-concepts .kai-tab { min-height: 37px; padding: 6px 10px 7px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--kai-muted); font-size: 13px; font-weight: 600; }
  #browser-settings-concepts .kai-tab:hover { color: var(--kai-fg); }
  #browser-settings-concepts .kai-tab[aria-selected="true"] { border-bottom-color: var(--kai-accent); color: var(--kai-fg); }
  #browser-settings-concepts .kai-disclosure { padding: 0; }
  #browser-settings-concepts .kai-disclosure > summary { display: flex; gap: 8px; align-items: center; min-height: 46px; padding: 9px 14px; list-style: none; }
  #browser-settings-concepts .kai-disclosure > summary::-webkit-details-marker { display: none; }
  #browser-settings-concepts .kai-disclosure > summary strong { font-weight: 700; }
  #browser-settings-concepts .kai-disclosure > summary svg:last-child { margin-inline-start: auto; }
  #browser-settings-concepts .kai-disclosure[open] > summary { border-bottom: 1px solid var(--kai-border); }
  #browser-settings-concepts .kai-disclosure[open] > summary svg:last-child { transform: rotate(180deg); }
  #browser-settings-concepts .kai-disclosure .kai-box { border: 0; border-radius: 0 0 9px 9px; box-shadow: none; }
  #browser-settings-concepts :is(.kai-disclosure, [role="tabpanel"]) .kai-box-top { justify-content: flex-end; background: transparent; border: 0; padding-bottom: 0; min-height: 0; }
  #browser-settings-concepts :is(.kai-disclosure, [role="tabpanel"]) .kai-box-top h2 { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
  #browser-settings-concepts :is(.kai-disclosure, [role="tabpanel"]) .kai-box-top:has(h2:only-child) { display: none; }
  #browser-settings-concepts .kai-runtime-first .kai-runtime-actions { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  #browser-settings-concepts .kai-runtime-first .kai-operation { grid-column: 1 / -1; }
  #browser-settings-concepts .kai-pending { position: sticky; bottom: 12px; z-index: 1; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 9px 12px; }
  #browser-settings-concepts .kai-feedback { color: var(--kai-muted); font-size: 12px; }
  #browser-settings-concepts .kai-feedback:empty { display: none; }
  @container (max-width: 740px) {
    #browser-settings-concepts .kai-desk { grid-template-columns: minmax(0, 1fr); }
  }
  @container (max-width: 600px) {
    #browser-settings-concepts .kai-surface { grid-template-columns: minmax(0, 1fr); }
    #browser-settings-concepts .kai-rail { display: none; }
    #browser-settings-concepts .kai-topbar { padding: 0 13px; }
    #browser-settings-concepts .kai-content { padding: 14px 12px 16px; }
    #browser-settings-concepts .kai-runtime-first .kai-runtime-actions { grid-template-columns: minmax(0, 1fr); }
  }
  @container (max-width: 420px) {
    #browser-settings-concepts .kai-grid, #browser-settings-concepts .kai-config-row { grid-template-columns: minmax(0, 1fr); }
    #browser-settings-concepts .kai-tab { padding-inline: 7px; }
    #browser-settings-concepts .kai-create { grid-template-columns: minmax(0, 1fr); }
    #browser-settings-concepts .kai-create .kai-button { justify-self: start; }
  }
  @media (pointer: coarse) {
    #browser-settings-concepts :is(.kai-tab, .kai-button, .kai-input) { min-height: 44px; }
    #browser-settings-concepts .kai-range input { min-height: 28px; }
  }
</style>
<div id="browser-settings-concepts">
  <!-- Standalone controls start -->
  <header class="concept-toolbar">
    <div class="concept-picker" role="group" aria-label="Browser settings layouts">
      <button class="kai-button" type="button" data-concept="profiles-first" aria-pressed="true">Profiles first</button>
      <button class="kai-button" type="button" data-concept="tabs" aria-pressed="false">Tabs</button>
      <button class="kai-button" type="button" data-concept="runtime-first" aria-pressed="false">Runtime first</button>
    </div>
    <p>Interactive preview · Sample data</p>
  </header>
  <!-- Standalone controls end -->
  <div class="viz-carousel" aria-label="Browser settings layouts">
    <section data-variant="Profiles first" data-layout="profiles-first" aria-label="Profiles-first layout"></section>
    <section data-variant="Tabs" data-layout="tabs" aria-label="Tabbed layout" hidden></section>
    <section data-variant="Runtime first" data-layout="runtime-first" aria-label="Runtime-first layout" hidden></section>
  </div>

  <template data-template="shell">
    <div class="kai-surface">
      <aside class="kai-rail" aria-label="Kai Console settings sidebar">
        <div class="kai-rail-group">
          <span class="kai-mark" aria-label="Kai Console"><i data-lucide="bot" aria-hidden="true"></i></span>
          <span class="kai-rail-item"><i data-lucide="arrow-left" aria-hidden="true"></i></span>
        </div>
        <div class="kai-rail-group">
          <span class="kai-rail-item"><i data-lucide="palette" aria-hidden="true"></i></span>
          <span class="kai-rail-item"><i data-lucide="key-round" aria-hidden="true"></i></span>
        </div>
        <div class="kai-rail-group">
          <span class="kai-rail-item"><i data-lucide="link-2" aria-hidden="true"></i></span>
          <span class="kai-rail-item"><i data-lucide="cloud-cog" aria-hidden="true"></i></span>
        </div>
        <div class="kai-rail-group">
          <span class="kai-rail-item"><i data-lucide="workflow" aria-hidden="true"></i></span>
          <span class="kai-rail-item"><i data-lucide="route" aria-hidden="true"></i></span>
          <span class="kai-rail-item"><i data-lucide="wrench" aria-hidden="true"></i></span>
          <span class="kai-rail-item"><i data-lucide="users" aria-hidden="true"></i></span>
          <span class="kai-rail-item"><i data-lucide="bot" aria-hidden="true"></i></span>
          <span class="kai-rail-item"><i data-lucide="book-open" aria-hidden="true"></i></span>
          <span class="kai-rail-item"><i data-lucide="braces" aria-hidden="true"></i></span>
        </div>
        <div class="kai-rail-group">
          <span class="kai-rail-item"><i data-lucide="network" aria-hidden="true"></i></span>
        </div>
        <div class="kai-rail-group">
          <span class="kai-rail-item"><i data-lucide="file-text" aria-hidden="true"></i></span>
          <span class="kai-rail-item" aria-current="page" aria-label="Browser"><i data-lucide="globe" aria-hidden="true"></i></span>
          <span class="kai-rail-item"><i data-lucide="cog" aria-hidden="true"></i></span>
        </div>
        <div class="kai-rail-group">
          <span class="kai-rail-item"><i data-lucide="chart-no-axes-column" aria-hidden="true"></i></span>
        </div>
      </aside>
      <div>
        <header class="kai-topbar">Settings <i data-lucide="chevron-right" aria-hidden="true"></i> <strong>Browser</strong></header>
        <div class="kai-content">
          <header class="kai-heading">
            <h1>Browser</h1>
          </header>
          <div data-layout-body></div>
          <div class="kai-box kai-pending" data-pending hidden>
            <p class="kai-hint" data-pending-label role="status"></p>
            <div class="kai-action-row">
              <button class="kai-button" type="button" data-discard>Discard</button>
              <button class="kai-button kai-button-main" type="button" data-save>Save changes</button>
            </div>
          </div>
          <p class="kai-feedback" data-settings-feedback role="status"></p>
        </div>
      </div>
    </div>
  </template>

  <template data-template="profiles-first">
    <div class="kai-desk">
      <div data-slot="profiles"></div>
      <div class="kai-stack">
        <div data-slot="setup"></div>
        <div data-slot="viewer"></div>
      </div>
      <details class="kai-box kai-disclosure kai-span">
        <summary><i data-lucide="sliders-horizontal" aria-hidden="true"></i><strong>Browser configuration</strong><i data-lucide="chevron-down" aria-hidden="true"></i></summary>
        <div data-slot="config"></div>
      </details>
    </div>
  </template>

  <template data-template="tabs">
    <div class="kai-stack">
      <div class="kai-tabs" role="tablist" aria-label="Browser settings sections">
        <button class="kai-tab" type="button" role="tab" data-section="profiles">Login profiles</button>
        <button class="kai-tab" type="button" role="tab" data-section="setup">Browser setup</button>
        <button class="kai-tab" type="button" role="tab" data-section="viewer">Live viewer</button>
        <button class="kai-tab" type="button" role="tab" data-section="config">Browser configuration</button>
      </div>
      <div role="tabpanel" data-slot="profiles"></div>
      <div role="tabpanel" data-slot="setup" hidden></div>
      <div role="tabpanel" data-slot="viewer" hidden></div>
      <div role="tabpanel" data-slot="config" hidden></div>
    </div>
  </template>

  <template data-template="runtime-first">
    <div class="kai-stack kai-runtime-first">
      <div data-slot="setup"></div>
      <details class="kai-box kai-disclosure">
        <summary><i data-lucide="users" aria-hidden="true"></i><strong>Login profiles</strong><i data-lucide="chevron-down" aria-hidden="true"></i></summary>
        <div data-slot="profiles"></div>
      </details>
      <details class="kai-box kai-disclosure">
        <summary><i data-lucide="monitor" aria-hidden="true"></i><strong>Live viewer</strong><i data-lucide="chevron-down" aria-hidden="true"></i></summary>
        <div data-slot="viewer"></div>
      </details>
      <details class="kai-box kai-disclosure">
        <summary><i data-lucide="sliders-horizontal" aria-hidden="true"></i><strong>Browser configuration</strong><i data-lucide="chevron-down" aria-hidden="true"></i></summary>
        <div data-slot="config"></div>
      </details>
    </div>
  </template>

  <template data-template="profiles">
    <section class="kai-box">
      <header class="kai-box-top">
        <h2>Login profiles</h2>
        <button class="kai-button" type="button" data-reload>Reload profiles</button>
      </header>
      <div class="kai-body">
        <div class="kai-grid">
          <label class="kai-field">Default login profile
            <select class="kai-input" data-profile-choice="account"></select>
          </label>
          <label class="kai-field">No workspace login profile
            <select class="kai-input" data-profile-choice="temporary"></select>
          </label>
        </div>
        <form class="kai-create" autocomplete="off" data-create>
          <label class="kai-field">New profile name
            <input class="kai-input" name="profileName" maxlength="100" required>
          </label>
          <button class="kai-button kai-button-main" type="submit" disabled>Create profile</button>
        </form>
        <div data-profile-list></div>
        <p class="kai-feedback" data-profile-feedback role="status"></p>
      </div>
    </section>
  </template>

  <template data-template="profile-row">
    <div class="kai-profile-row">
      <strong class="kai-profile-name" data-profile-name></strong>
      <div class="kai-action-row" data-profile-actions>
        <button class="kai-button" type="button" data-rename>Rename</button>
        <button class="kai-button" type="button" data-delete>Delete</button>
      </div>
      <form class="kai-create" autocomplete="off" data-rename-form hidden>
        <label class="kai-field">New name
          <input class="kai-input" name="profileName" maxlength="100" required>
        </label>
        <div class="kai-action-row">
          <button class="kai-button kai-button-main" type="submit">Save name</button>
          <button class="kai-button" type="button" data-cancel-rename>Cancel</button>
        </div>
      </form>
    </div>
  </template>

<script>
  (() => {
    const root = document.getElementById("browser-settings-concepts");
    const clone = name => root.querySelector(`template[data-template="${name}"]`).content.cloneNode(true);
    const templates = [...root.querySelectorAll("[data-layout]")];

    for (const variant of templates) {
      const layout = variant.dataset.layout;
      variant.append(clone("shell"));
      variant.querySelector("[data-layout-body]").append(clone(layout));
      for (const slot of variant.querySelectorAll("[data-slot]")) {
        slot.append(clone(slot.dataset.slot));
      }
      for (const node of variant.querySelectorAll("[id], [for], [list]")) {
        if (node.id) node.id = `${layout}-${node.id}`;
        if (node.hasAttribute("for")) node.setAttribute("for", `${layout}-${node.getAttribute("for")}`);
        if (node.hasAttribute("list")) node.setAttribute("list", `${layout}-${node.getAttribute("list")}`);
      }
      bindTabs(variant, layout);
      bindProfiles(variant);
      bindSettings(variant);
    }

    function bindTabs(variant, layout) {
      const tabs = [...variant.querySelectorAll("[data-section]")];
      if (!tabs.length) return;
      const panels = tabs.map(tab => variant.querySelector(`[data-slot="${tab.dataset.section}"]`));

      function activate(activeIndex) {
        tabs.forEach((tab, index) => {
          const active = index === activeIndex;
          tab.setAttribute("aria-selected", String(active));
          tab.tabIndex = active ? 0 : -1;
          panels[index].hidden = !active;
        });
      }

      tabs.forEach((tab, index) => {
        const panel = panels[index];
        tab.id = `${layout}-tab-${tab.dataset.section}`;
        panel.id = `${layout}-panel-${tab.dataset.section}`;
        tab.setAttribute("aria-controls", panel.id);
        panel.setAttribute("aria-labelledby", tab.id);
        tab.addEventListener("click", () => activate(index));
        tab.addEventListener("keydown", event => {
          const next = {
            ArrowLeft: (index + tabs.length - 1) % tabs.length,
            ArrowRight: (index + 1) % tabs.length,
            Home: 0,
            End: tabs.length - 1,
          }[event.key];
          if (next === undefined) return;
          event.preventDefault();
          activate(next);
          tabs[next].focus();
        });
      });
      activate(0);
    }

    function bindProfiles(variant) {
      const list = variant.querySelector("[data-profile-list]");
      const feedback = variant.querySelector("[data-profile-feedback]");
      const choices = [...variant.querySelectorAll("[data-profile-choice]")];
      const create = variant.querySelector("[data-create]");
      const createName = create.elements.profileName;
      const createButton = create.querySelector("button");
      const profiles = [
        { id: "builtin", name: "Default" },
        { id: "research", name: "Research" },
        { id: "personal", name: "Personal" },
      ];
      const selected = { account: "builtin", temporary: "personal" };
      let nextProfileId = 1;

      function render() {
        for (const select of choices) {
          select.replaceChildren(...profiles.map(profile => new Option(profile.name, profile.id)));
          select.value = selected[select.dataset.profileChoice];
        }
        list.replaceChildren(...profiles.map(profile => {
          const fragment = clone("profile-row");
          const row = fragment.firstElementChild;
          const rename = row.querySelector("[data-rename]");
          const remove = row.querySelector("[data-delete]");
          const actions = row.querySelector("[data-profile-actions]");
          const renameForm = row.querySelector("[data-rename-form]");
          const renameName = renameForm.elements.profileName;
          row.querySelector("[data-profile-name]").textContent = `${profile.name}${profile.id === "builtin" ? " (built-in)" : ""}`;
          actions.hidden = profile.id === "builtin";
          rename.setAttribute("aria-label", `Rename ${profile.name}`);
          remove.setAttribute("aria-label", `Delete ${profile.name}`);
          rename.addEventListener("click", () => {
            actions.hidden = true;
            renameForm.hidden = false;
            renameName.value = profile.name;
            renameName.focus();
            renameName.select();
          });
          renameForm.querySelector("[data-cancel-rename]").addEventListener("click", () => {
            renameForm.hidden = true;
            actions.hidden = false;
            rename.focus();
          });
          renameForm.addEventListener("submit", event => {
            event.preventDefault();
            const name = renameName.value.trim();
            if (!name) return;
            profile.name = name;
            render();
            feedback.textContent = `Renamed to ${name}.`;
          });
          remove.addEventListener("click", () => {
            profiles.splice(profiles.indexOf(profile), 1);
            for (const key of Object.keys(selected)) {
              if (selected[key] === profile.id) selected[key] = "builtin";
            }
            render();
            feedback.textContent = `Deleted ${profile.name}.`;
          });
          return fragment;
        }));
      }

      for (const select of choices) {
        select.addEventListener("change", () => {
          selected[select.dataset.profileChoice] = select.value;
          render();
          feedback.textContent = "Login profile updated.";
        });
      }
      variant.querySelector("[data-reload]").addEventListener("click", () => {
        render();
        feedback.textContent = "Profiles refreshed.";
      });
      createName.addEventListener("input", () => { createButton.disabled = !createName.value.trim(); });
      create.addEventListener("submit", event => {
        event.preventDefault();
        const name = createName.value.trim();
        if (!name) return;
        profiles.push({ id: `profile-${nextProfileId++}`, name });
        create.reset();
        createButton.disabled = true;
        render();
        feedback.textContent = `Created ${name}.`;
        createName.focus();
      });
      render();
    }

    function bindSettings(variant) {
      const one = selector => variant.querySelector(selector);
      const fields = [...variant.querySelectorAll("[data-setting]")];
      const saved = Object.fromEntries(fields.map(field => [field.dataset.setting, field.value]));
      const quality = one('[data-setting="quality"]');
      const resolution = one('[data-setting="resolution"]');
      const sizePresets = [...one("datalist").options].map(option => option.label);
      const pending = one("[data-pending]");
      const pendingLabel = one("[data-pending-label]");
      const feedback = one("[data-settings-feedback]");
      const status = one("[data-status]");
      const check = one("[data-check]");
      const reinstall = one("[data-reinstall]");
      const detectedPath = one("[data-detected-path]");
      const operationOutput = one("[data-operation-output]");
      const executable = one('[data-setting="executable"]');

      function render() {
        const changed = fields.filter(field => field.value !== saved[field.dataset.setting]);
        const pathChanged = executable.value !== saved.executable;
        const size = sizePresets[Number(resolution.value)];
        one("[data-quality-output]").textContent = `${quality.value}%`;
        one("[data-size-output]").textContent = size;
        resolution.setAttribute("aria-valuetext", size);
        pending.hidden = !changed.length;
        const restart = changed.some(field => field.dataset.setting === "storage");
        const count = changed.length;
        pendingLabel.textContent = `${count} unsaved ${count === 1 ? "change" : "changes"}${restart ? " · Restart required" : ""}`;
        check.disabled = reinstall.disabled = pathChanged;
        one("[data-executable-hint]").hidden = !pathChanged;
      }

      function updateDraft() {
        feedback.textContent = "";
        render();
      }

      for (const field of fields) field.addEventListener("input", updateDraft);
      one("[data-reset-viewer]").addEventListener("click", () => {
        quality.value = "50";
        resolution.value = "2";
        updateDraft();
      });
      one("[data-refresh]").addEventListener("click", () => {
        operationOutput.textContent = "Browser status refreshed.";
        operationOutput.closest("details").open = true;
      });
      check.addEventListener("click", () => {
        status.textContent = "Browser ready";
        operationOutput.textContent = "Browser check completed. Browser is ready for browser tools.";
        operationOutput.closest("details").open = true;
      });
      reinstall.addEventListener("click", () => {
        status.textContent = "Browser ready";
        operationOutput.textContent = "Simulated reinstall completed.";
        operationOutput.closest("details").open = true;
      });
      one("[data-discard]").addEventListener("click", () => {
        fields.forEach(field => { field.value = saved[field.dataset.setting]; });
        render();
        feedback.textContent = "Draft changes discarded.";
      });
      one("[data-save]").addEventListener("click", () => {
        const invalidField = fields.find(field => field.value !== saved[field.dataset.setting] && !field.validity.valid);
        if (invalidField) {
          const tabPanel = invalidField.closest('[role="tabpanel"]');
          if (tabPanel?.hidden) one(`[aria-controls="${tabPanel.id}"]`).click();
          const disclosure = invalidField.closest("details");
          if (disclosure) disclosure.open = true;
          invalidField.reportValidity();
          return;
        }
        if (executable.value !== saved.executable) {
          detectedPath.textContent = executable.value.trim() || "/usr/bin/google-chrome";
          status.textContent = "Check required";
        }
        fields.forEach(field => { saved[field.dataset.setting] = field.value; });
        render();
        feedback.textContent = "Settings saved in this preview.";
      });
      render();
    }

    /* Design controls start */
    if (globalThis.Tweak) {
      for (const variant of templates) {
        const surface = variant.querySelector(".kai-surface");
        surface.setAttribute("aria-label", variant.getAttribute("aria-label"));
        const content = surface.querySelector(".kai-content");
        const spacing = { gap: 16 };
        const tweak = new Tweak({
          container: surface,
          onChange: () => { content.style.gap = `${spacing.gap}px`; },
        });
        tweak.addSlider(spacing, "gap", { label: "Section spacing", min: 8, max: 24, unit: "px" });
      }
    }
    /* Design controls end */
  })();
</script>

<script>
  (() => {
    const root = document.getElementById("browser-settings-concepts");
    const variants = [...root.querySelectorAll("[data-layout]")];
    const buttons = [...root.querySelectorAll("[data-concept]")];
    for (const button of buttons) {
      button.addEventListener("click", () => {
        for (const variant of variants) variant.hidden = variant.dataset.layout !== button.dataset.concept;
        for (const option of buttons) option.setAttribute("aria-pressed", String(option === button));
      });
    }
    const svgNamespace = "http://www.w3.org/2000/svg";
    for (const marker of root.querySelectorAll("[data-lucide]")) {
      const icon = document.createElementNS(svgNamespace, "svg");
      const use = document.createElementNS(svgNamespace, "use");
      icon.setAttribute("viewBox", "0 0 24 24");
      icon.setAttribute("fill", "none");
      icon.setAttribute("stroke", "currentColor");
      icon.setAttribute("stroke-width", "2");
      icon.setAttribute("stroke-linecap", "round");
      icon.setAttribute("stroke-linejoin", "round");
      icon.setAttribute("aria-hidden", "true");
      use.setAttribute("href", `#kai-icon-${marker.dataset.lucide}`);
      icon.append(use);
      marker.replaceWith(icon);
    }
  })();
</script>
